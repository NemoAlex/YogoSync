<!doctype html>
<html lang="en" class="i18n-loading"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="YogoSync 设置">YogoSync 设置</title><link rel="stylesheet" href="style.css"></head>
<body><main class="preferences-shell">
<header class="page-heading"><h1 data-i18n="设置">设置</h1></header>
<div id="settings-message" class="message" role="status" hidden></div>
<form id="preferences-form"><section class="group settings-group"><div class="setting-row"><label for="language" data-i18n="语言">语言</label><select id="language" disabled><option value="system" data-i18n="跟随系统">跟随系统</option><option value="zh-CN">简体中文</option><option value="en">English</option></select></div><div class="setting-row"><div><label for="launch-at-login" data-i18n="登录系统后自动启动">登录系统后自动启动</label></div><input id="launch-at-login" disabled type="checkbox" class="checkbox-switch"></div><div class="setting-row"><div><label for="completed-seconds" data-i18n="完成图标停留时间">完成图标停留时间</label></div><div class="number-field"><input id="completed-seconds" disabled type="number" min="2" max="60" value="8" required><span data-i18n="秒">秒</span></div></div></section></form>
</main><script src="i18n.js" data-scripts="window-actions.js,settings.js"></script></body></html>
