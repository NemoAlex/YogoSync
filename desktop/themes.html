<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOGO Pet · 主题</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="themes.css"><link rel="stylesheet" href="glow.css"></head>
<body><main class="theme-shell">
<aside class="theme-sidebar"><h1>主题</h1><label for="theme-list">我的主题</label><select id="theme-list"></select><div class="theme-tools"><button id="new-theme">新建</button><button id="copy-theme">复制</button><button id="import-theme">导入</button></div><p id="active-theme" class="muted"></p><nav id="state-list" aria-label="状态"></nav></aside>
<section class="theme-workspace"><header class="theme-header"><input id="theme-name" maxlength="40" aria-label="主题名称" placeholder="主题名称"><div><button id="export-theme">导出</button><button id="save-theme">保存</button><button id="apply-theme" class="primary">应用主题</button></div></header>
<p id="theme-message" role="status" aria-live="polite"></p>
<div class="design-area"><section><div class="editor-heading"><h2 id="state-title">待机</h2><span id="dirty-status" class="muted"></span><div class="history-tools"><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button></div></div><div id="pixel-editor" class="pixel-editor" aria-label="6 × 6 点阵画布"></div><div class="color-controls"><label class="color-picker"><input id="paint-color" type="color" value="#005a78" aria-label="自定义画笔颜色"><span>自定义颜色</span></label><input id="color-hex" type="text" value="#005A78" maxlength="7" spellcheck="false" aria-label="十六进制颜色值" placeholder="#RRGGBB"></div><div class="paint-tools"><span class="muted">常用</span><div id="swatches"></div><button id="eraser" aria-pressed="false">橡皮</button><button id="clear-frame">清空</button></div></section>
<section class="preview-area"><div class="preview-heading"><h2>发光预览</h2></div><div id="glow-preview" class="glow-preview" aria-label="动画预览"></div><div class="preview-controls"><button id="play-preview">播放循环</button><p id="preview-time" class="muted"></p></div><p class="muted">模拟光晕，以键盘实际效果为准</p></section></div>
<section class="timeline"><div class="timeline-heading"><h2>动画帧 <span id="frame-count"></span></h2><div><button id="add-frame">新增</button><button id="copy-frame">复制帧</button><button id="delete-frame">删除帧</button></div></div><div id="frame-list" class="frame-list" aria-label="动画帧"></div><div id="frame-options" class="frame-options"><label for="frame-duration">显示时间</label><input id="frame-duration" type="number" min="100" max="60000" step="1" value="1000"><span>毫秒</span><button id="move-left" aria-label="帧前移">← 前移</button><button id="move-right" aria-label="帧后移">后移 →</button><span id="loop-duration" class="muted"></span></div></section>
</section></main>
<dialog id="discard-dialog"><h2>放弃未保存的修改？</h2><p>切换后将丢失当前修改。</p><div><button id="keep-editing" autofocus>继续编辑</button><button id="discard-changes">放弃修改</button></div></dialog>
<script src="window-actions.js"></script><script src="glow.js"></script><script src="themes.js"></script></body></html>
