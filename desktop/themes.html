<!doctype html>
<html lang="en" class="i18n-loading"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="YogoSync · 主题">YogoSync · 主题</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="themes.css"><link rel="stylesheet" href="glow.css"></head>
<body><main class="theme-shell">
<aside class="theme-sidebar"><h1 data-i18n="主题">主题</h1><label for="theme-list" data-i18n="我的主题">我的主题</label><select id="theme-list"></select><div class="theme-tools"><button id="new-theme" data-i18n="新建">新建</button><button id="copy-theme" data-i18n="复制">复制</button><button id="import-theme" data-i18n="导入">导入</button></div><p id="active-theme" class="muted"></p><nav id="state-list" aria-label="状态" data-i18n-aria-label="状态"></nav></aside>
<section class="theme-workspace"><header class="theme-header"><input id="theme-name" maxlength="40" aria-label="主题名称" data-i18n-aria-label="主题名称" placeholder="主题名称" data-i18n-placeholder="主题名称"><div><button id="export-theme" data-i18n="导出">导出</button><button id="save-theme" data-i18n="保存">保存</button><button id="apply-theme" class="primary" data-i18n="应用主题">应用主题</button></div></header>
<p id="theme-message" role="status" aria-live="polite"></p>
<div class="design-area"><section><div class="editor-heading"><h2 id="state-title" data-i18n="待机">待机</h2><span id="dirty-status" class="muted"></span><div class="history-tools"><button id="undo" disabled data-i18n="撤销">撤销</button><button id="redo" disabled data-i18n="重做">重做</button></div></div><div id="pixel-editor" class="pixel-editor" aria-label="6 × 6 点阵画布" data-i18n-aria-label="6 × 6 点阵画布"></div><div class="color-controls"><label class="color-picker"><input id="paint-color" type="color" value="#005a78" aria-label="自定义画笔颜色" data-i18n-aria-label="自定义画笔颜色"><span data-i18n="自定义颜色">自定义颜色</span></label><input id="color-hex" type="text" value="#005A78" maxlength="7" spellcheck="false" aria-label="十六进制颜色值" data-i18n-aria-label="十六进制颜色值" placeholder="#RRGGBB"></div><div class="paint-tools"><span class="muted" data-i18n="常用">常用</span><div id="swatches"></div><button id="eraser" aria-pressed="false" data-i18n="橡皮">橡皮</button><button id="clear-frame" data-i18n="清空">清空</button></div></section>
<section class="preview-area"><div class="preview-heading"><h2 data-i18n="发光预览">发光预览</h2><div class="cover-picker" role="group" aria-label="屏罩颜色" data-i18n-aria-label="屏罩颜色"><span data-i18n="屏罩">屏罩</span><button type="button" data-cover="black" aria-pressed="true" data-i18n="黑色">黑色</button><button type="button" data-cover="white" aria-pressed="false" data-i18n="白色">白色</button><button type="button" data-cover="yellow" aria-pressed="false" data-i18n="黄色">黄色</button></div></div><div id="glow-preview" class="glow-preview" aria-label="动画预览" data-i18n-aria-label="动画预览"></div><div class="preview-controls"><button id="play-preview" data-i18n="播放循环">播放循环</button><p id="preview-time" class="muted"></p></div><p class="muted" data-i18n="模拟光晕，以键盘实际效果为准">模拟光晕，以键盘实际效果为准</p></section></div>
<section class="timeline"><div class="timeline-heading"><h2><span data-i18n="动画帧">动画帧</span> <span id="frame-count"></span></h2><div><button id="add-frame" data-i18n="新增">新增</button><button id="copy-frame" data-i18n="复制帧">复制帧</button><button id="delete-frame" data-i18n="删除帧">删除帧</button></div></div><div id="frame-list" class="frame-list" aria-label="动画帧" data-i18n-aria-label="动画帧"></div><div id="frame-options" class="frame-options"><label for="frame-duration" data-i18n="显示时间">显示时间</label><input id="frame-duration" type="number" min="100" max="60000" step="1" value="1000"><span data-i18n="毫秒">毫秒</span><button id="move-left" aria-label="帧前移" data-i18n-aria-label="帧前移" data-i18n="← 前移">← 前移</button><button id="move-right" aria-label="帧后移" data-i18n-aria-label="帧后移" data-i18n="后移 →">后移 →</button><span id="loop-duration" class="muted"></span></div></section>
</section></main>
<dialog id="discard-dialog"><h2 data-i18n="放弃未保存的修改？">放弃未保存的修改？</h2><p data-i18n="切换后将丢失当前修改。">切换后将丢失当前修改。</p><div><button id="keep-editing" autofocus data-i18n="继续编辑">继续编辑</button><button id="discard-changes" data-i18n="放弃修改">放弃修改</button></div></dialog>
<script src="i18n.js" data-scripts="window-actions.js,glow.js,themes.js"></script></body></html>
