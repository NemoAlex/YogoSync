<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="yogo-token" content="__TOKEN__"><title>YogoSync · 任务在这里发光</title><link rel="stylesheet" href="/style.css"></head><body><main><header><span class="brand">YOGO <b>Pet</b></span><span class="badge">Codex 任务伙伴</span></header><section class="hero"><div><p class="eyebrow">一小块屏幕，陪你把事情做好。</p><h1>把任务状态，<br>放在你的键盘上。</h1><p class="intro">开始思考、忙着执行、等你确认、完成回复。<br>你的像素伙伴会告诉你现在进行到了哪一步。</p><div class="actions"><button id="connect">连接 YOGO 接收器</button><button id="disconnect" class="secondary" disabled>恢复原灯效</button></div><p id="connection" class="muted">支持 YOGO 75 PRO · 2.4G 接收器</p><p id="error" role="alert"></p></div><div class="device"><div class="screws"><i></i><span>YOGO / 06 × 06</span><i></i></div><div id="matrix" aria-label="6×6 点阵图标预览"></div><div class="device-bottom"><span class="led"></span><span id="state">待机</span><span id="mode">实时状态</span></div></div></section><section class="controls"><div class="section-head"><h2>试试它的表情</h2><span>预览 5 秒后自动恢复任务状态</span></div><div id="states"><button data-state="idle">待机</button><button data-state="thinking">思考</button><button data-state="working">执行</button><button data-state="waiting">等你确认</button><button data-state="done">回复完成</button><button data-state="interrupted">已中断</button></div></section><footer><span id="events">等待 Codex 事件 · 安装插件并信任 Hooks 后自动同步</span><span>本地运行 · 不读取对话正文</span></footer><p class="note">首版在状态变化时切换静态图标。多任务同时运行时，优先显示等待确认和忙碌状态。完成表示本轮回复结束。</p></main><script type="module" src="/app.js"></script></body></html>
